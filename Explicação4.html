<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {
            border: 1px black;
            border: 2px dashed;
            border-collapse: collapse;
        }
        td{
            text-align: center;
            padding: 2%;
        }
        .cabeçalho{
            background-color: aliceblue;
        }
    </style>
</head>
<body>
    <table>
        <caption>Trajetória Academica e Profissional</caption>
        <tr class="cabeçalho">
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de Formação</th>
        </tr>
        <tr class="cabeçalho">
            <th>Graduação</th>
            <th>Pós-Graduação</th>
        </tr>
        <tr>
            <th>José</th>
            <td>Ciencias da Computação</td>
            <td>Inteligencia Artifical</td>
            <td>2023</td>
        </tr>
        <tr>
            <th>Ana</th>
            <td>Eng de software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>
    </table>
</body>
</html>
